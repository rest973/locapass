<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<meta property="og:description" content="현지 사람이 쓰는 지역 패스로 짠 일본·대만 소도시 여행을, 검색하기 전에 먼저 보여줘요. 판매자와 무관, 계정 없음.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230E6F6A%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27%3E%E1%84%85%E1%85%A9%3C/text%3E%3C/svg%3E">
<style>
/* 뼈대_재설계_v1 §4 — 화면 다섯: 피드 · 여행 · 지역 · 출발 도시 · 보관함. 이용자 화면에 내부 어휘·계측·버전 없음 */
:root{--bg:#F7F7F4;--card:#FFFFFF;--ink:#1B2530;--ink2:#4A555D;--mute:#7A8580;--line:#E2E5E0;--accent:#0E6F6A;--accent-soft:#E3EFED;--warn:#9C3F2B;--ph:#D9DCD6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#131A1B;--card:#1C2527;--ink:#E6EAE6;--ink2:#C0C9C4;--mute:#8D9994;--line:#2C3739;--accent:#56B8B1;--accent-soft:#17302F;--warn:#E0806A;--ph:#2A3335}}
:root[data-theme="dark"]{--bg:#131A1B;--card:#1C2527;--ink:#E6EAE6;--ink2:#C0C9C4;--mute:#8D9994;--line:#2C3739;--accent:#56B8B1;--accent-soft:#17302F;--warn:#E0806A;--ph:#2A3335}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
.app{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 8px;position:sticky;top:0;background:var(--bg);z-index:4}
.top .name{font-weight:700;font-size:17px;letter-spacing:-.01em}
.top .name small{font-weight:400;color:var(--mute);font-size:12.5px;margin-left:8px}
.top .ttl{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2);white-space:nowrap}
.pill.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 0;scrollbar-width:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chips .lab{flex:0 0 auto;font-size:12.5px;color:var(--mute);margin-right:2px}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink2)}
.chips button.on{border-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:600}
.tiles{padding:6px 0 0}
.tile{display:block;margin:12px 16px 0}
.tile .ph{position:relative;background:var(--ph) center/cover no-repeat;height:66vh;max-height:540px;border-radius:16px;overflow:hidden;display:flex;align-items:flex-end}
.tile .tx{position:absolute;left:0;right:0;bottom:0;padding:80px 16px 16px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.72) 100%);color:#fff}
.tile .s{font-weight:700;font-size:19px;line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.tile .a{font-size:13.5px;opacity:.95;margin-top:8px;line-height:1.45}
.tile .saved{position:absolute;top:12px;right:12px;font-size:11.5px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:3px 9px}
.empty{margin:20px 16px;color:var(--mute);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;font-size:14px}
.foot{padding:20px 16px 48px;color:var(--mute);font-size:12px;line-height:1.7;border-top:1px solid var(--line);margin-top:20px}
.foot a{color:var(--accent)}
.hero{position:relative;background:var(--ph) center/cover no-repeat;height:52vh;max-height:420px;display:flex;align-items:flex-end}
.hero .tx{padding:70px 16px 16px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.7));color:#fff;width:100%}
.hero .s{font-weight:700;font-size:20px;line-height:1.35;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.sec{padding:16px 16px 0}
.sec h3{margin:0 0 8px;font-size:15.5px}
.sec p{margin:0 0 8px;color:var(--ink)}
.m{color:var(--mute);font-size:12.5px}
.sw{display:flex;gap:6px;margin:4px 0 8px;flex-wrap:wrap}
.sw button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink2)}
.sw button.on{border-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:600}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.glance div{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 11px;font-size:13.5px;line-height:1.5}
.glance b{display:block;font-size:11.5px;color:var(--mute);font-weight:500;margin-bottom:2px}
.day{border:1px solid var(--line);background:var(--card);border-radius:12px;margin:0 0 8px;overflow:hidden}
.day h4{margin:0;padding:8px 12px;background:var(--accent-soft);color:var(--accent);font-size:13.5px}
.day ul{margin:0;padding:8px 12px 8px 28px;font-size:14px}
.day li{margin:0 0 4px}
.day li .m{display:block}
.pass{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.pass .n{font-size:12px;color:var(--mute)}
.pass .big{font-size:16px;font-weight:700;margin:2px 0 6px}
.pass p{margin:0 0 6px;font-size:14px}
.btns{display:flex;gap:8px;margin:4px 0 0}
.btns button{flex:1;border:1px solid var(--ink);background:var(--card);border-radius:12px;padding:11px;font-size:14px;font-weight:600}
.btns button.pri{background:var(--ink);color:var(--bg)}
details{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;margin:0 0 8px}
summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.step{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.step:first-of-type{border-top:0}
.step i{font-style:normal;font-weight:700;color:var(--mute)}
.step b.t{display:block;font-size:12.5px;color:var(--mute);font-weight:500;margin-bottom:1px}
.ja{display:block;font-size:16.5px;line-height:1.55;margin:4px 0 2px;word-break:break-all;background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.step small{color:var(--mute);display:block;margin-top:3px;font-size:12.5px;line-height:1.5}
.pf{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.pf label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
.pf input,.pf select{font:inherit;font-size:13.5px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.cell{padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.cell:first-child{border-top:0}
.cell b{display:block;font-size:12px;color:var(--mute);font-weight:500}
.cell .q{display:block;margin-top:3px;padding:5px 8px;border-left:3px solid var(--line);color:var(--ink2);font-size:12.5px;line-height:1.5;word-break:break-all}
.cell a{color:var(--accent);font-size:12px;word-break:break-all}
.gap{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.gap b{display:block;font-size:12.5px}
.gap span{color:var(--mute)}
.list a{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px;margin:0 0 8px}
.list .ph{flex:0 0 88px;height:66px;background:var(--ph) center/cover no-repeat;border-radius:8px}
.list b{display:block;font-size:14px}
.list small{color:var(--mute);font-size:12.5px;line-height:1.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ── 데이터 ─────────────────────────────────────────────── */
let TRIPS=[], REGIONS={}, HUBS={}, HUBS_KO={}, PASSES=[], BLOCKS={};
const HOWTO={};
const FORM='https://docs.google.com/forms/d/e/1FAIpQLSfPXCP5U7lA57gtxzOIILrijgkbbuAIwVVsBoXa_RXaeyOAHQ/viewform';
async function load(){
  const [t,r,p]=await Promise.all([
    fetch('data/trips.json').then(x=>x.json()),
    fetch('data/regions.json').then(x=>x.json()),
    fetch('data/passes.json').then(x=>x.json()).catch(()=>[])]);
  TRIPS=t.trips.filter(x=>x.status==='published');
  r.regions.forEach(x=>REGIONS[x.region_id]=x);
  r.hubs.forEach(h=>{HUBS[h.hub_id]=h; HUBS_KO[h.name.ko]=h;});
  BLOCKS=r.blocks||{};
  PASSES=Array.isArray(p)?p:(p.passes||[]);
}
async function howto(pid){
  if(!pid) return null;
  if(HOWTO[pid]!==undefined) return HOWTO[pid];
  try{ HOWTO[pid]=await fetch('data/howto/'+pid+'.json').then(r=>r.ok?r.json():null); }catch(e){ HOWTO[pid]=null; }
  return HOWTO[pid];
}
/* ── 상태: 브라우저에만 ───────────────────────────────────── */
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const LSs=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let hub=LS('lp3_hub')||'';            // hub_id
let nightsF=LS('lp3_nights')||'';     // ''|'2'|'3'|'4+'
let saved=new Set((LS('lp3_saved')||'').split(',').filter(Boolean));
const saveSaved=()=>LSs('lp3_saved',[...saved].join(','));
/* ── 유틸 ─────────────────────────────────────────────── */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const plain=s=>String(s||'').replace(/\*\*/g,'');
function hoursKo(h){
  if(h==null) return ''; if(h===0) return '인천 직항';
  const w=Math.floor(h), f=h-w;
  if(f<0.05) return w+'시간'; if(Math.abs(f-0.5)<0.05) return w?w+'시간 반':'30분';
  if(!w) return Math.round(h*6)*10+'분'; return w+'시간 '+Math.round(f*6)*10+'분';
}
function fromLine(f){ if(!f) return ''; const hk=hoursKo(f.hours); if(!hk) return f.l3||''; return hk==='인천 직항'?hk:(f.hub+'에서 '+hk); }
function pickFrom(t,hid){ return (hid && t.from.find(f=>f.hub_id===hid)) || t.from[0]; }
function assure(t,f){ const l2=f.l2||t.l2; return (/박/.test(l2)?l2:(t.days_label+' · '+l2))+' · '+fromLine(f); }
function photoStyle(p){ return p&&p.src?`background-image:url(${p.src});background-position:${p.pos||'50% 50%'}`:''; }
function credit(p){ return p&&p.src?`사진 ${esc(p.credit)} · ${esc(p.license)} · Wikimedia Commons · 일부 자름`:''; }
function checkedLine(t){
  const m=(t.trust.label.match(/(\d{4}년 \d{1,2}월)/)||[])[1]||'';
  const iss=(t.passes[0]&&t.passes[0].issuer_ko)||'';
  return (m?m+' · ':'')+(iss?iss+' 공식 페이지 기준. ':'공식 페이지 기준. ')+'창구에서 최종 확인.';
}
function track(path){ try{ if(window.goatcounter&&goatcounter.count) goatcounter.count({path:path,title:path}); }catch(e){} }
function ev(name,extra){ try{ if(window.goatcounter&&goatcounter.count) goatcounter.count({path:'event/'+name+(extra?'/'+extra:''),title:name,event:true}); }catch(e){} }
let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1600); }
const app=document.getElementById('app');
function tripUrl(t,hid){ return '#/t/'+t.trip_id+(hid?'?from='+hid:''); }
/* ── 순서: 편집 선택 먼저, 같은 나라·같은 출발이 연달아 오지 않게 ── */
function order(list){
  const pool=list.slice().sort((a,b)=>(b.editor_pick?1:0)-(a.editor_pick?1:0)||a.source_cards[0]-b.source_cards[0]);
  const out=[];
  while(pool.length){
    let i=0;
    if(out.length){ const prev=out[out.length-1];
      const j=pool.findIndex(c=>c.region_id.slice(0,2)!==prev.region_id.slice(0,2)||c.hub!==prev.hub); if(j>=0) i=j; }
    out.push(pool.splice(i,1)[0]);
  }
  return out;
}
/* ── 1. 피드 ─────────────────────────────────────────── */
function hubChips(){
  const cnt={}; TRIPS.forEach(t=>t.kind==='trip'&&t.from.forEach(f=>{ if(f.hub_id&&HUBS[f.hub_id]&&HUBS[f.hub_id].direct_kr) cnt[f.hub_id]=(cnt[f.hub_id]||0)+1; }));
  const pri=['osaka','tokyo','nagoya','fukuoka','sapporo','taipei','kaohsiung'];
  return Object.keys(cnt).sort((a,b)=>(pri.indexOf(a)<0?9:pri.indexOf(a))-(pri.indexOf(b)<0?9:pri.indexOf(b))||cnt[b]-cnt[a]);
}
function renderFeed(){
  let list=TRIPS.filter(t=>t.kind==='trip');
  if(nightsF==='2') list=list.filter(t=>t.nights===2); else if(nightsF==='3') list=list.filter(t=>t.nights===3); else if(nightsF==='4+') list=list.filter(t=>t.nights>=4);
  list=order(list);
  if(hub){ const near=list.filter(t=>t.from.some(f=>f.hub_id===hub)).sort((a,b)=>(pickFrom(a,hub).hours??99)-(pickFrom(b,hub).hours??99)); const rest=list.filter(t=>!near.includes(t)); list=near.concat(rest); }
  const hubName=hub&&HUBS[hub]?HUBS[hub].name.ko:'';
  app.innerHTML=`
  <div class="top"><div class="name">로카패스 <small>현지 패스로 짠 소도시 여행</small></div><a class="pill" href="#/saved">보관 ${saved.size}</a></div>
  <div class="chips" id="hubChips"><span class="lab">출발</span><button data-h="" class="${hub?'':'on'}">안 정함</button>${hubChips().map(h=>`<button data-h="${h}" class="${hub===h?'on':''}">${esc(HUBS[h].name.ko)}</button>`).join('')}</div>
  <div class="chips" id="nChips"><span class="lab">며칠</span>${[['','전부'],['2','2박'],['3','3박'],['4+','4박+']].map(([v,l])=>`<button data-n="${v}" class="${nightsF===v?'on':''}">${l}</button>`).join('')}${hub?`<a class="pill" style="margin-left:auto" href="#/from/${hub}">${esc(hubName)}에서 →</a>`:''}</div>
  <div class="tiles">${list.map(t=>{ const f=pickFrom(t,hub); return `
    <a class="tile" href="${tripUrl(t,hub)}"><div class="ph" style="${photoStyle(t.photo)}">${saved.has(t.trip_id)?'<span class="saved">보관함에 있어요</span>':''}<div class="tx"><div class="s">${esc(f.scene||t.scene)}</div><div class="a">${esc(assure(t,f))}</div></div></div></a>`; }).join('')}
  ${list.length?'':'<p class="empty">이 조건에 맞는 여행이 아직 없어요.</p>'}</div>
  <div class="foot">가격·조건은 각 여행에 적힌 확인 시점의 공식 페이지 기준이에요. 판매자와 무관하고 계정이 없어요. <a href="about.html">이게 뭐예요 · 면책 · 출처 · 연락</a></div>`;
  document.getElementById('hubChips').onclick=e=>{ const b=e.target.closest('button[data-h]'); if(!b) return; hub=b.dataset.h; LSs('lp3_hub',hub); ev('hub',hub||'none'); renderFeed(); };
  document.getElementById('nChips').onclick=e=>{ const b=e.target.closest('button[data-n]'); if(!b) return; nightsF=b.dataset.n; LSs('lp3_nights',nightsF); renderFeed(); };
  window.scrollTo(0,0); track('/');
}
/* ── 2. 여행 한 페이지 ───────────────────────────────── */
let cur=null;
async function renderTrip(id,q){
  const t=TRIPS.find(x=>x.trip_id===id); if(!t){ location.hash='#/'; return; }
  const h=await howto(t.passes[0]&&t.passes[0].pass_id);
  const state={fromId:(q.from&&t.from.some(f=>f.hub_id===q.from))?q.from:t.from[0].hub_id, v:(q.v&&t.variants.some(x=>x.key===q.v))?q.v:null, date:'', adults:2, children:0};
  const region=REGIONS[t.region_id];
  function active(){ return state.v ? t.variants.find(x=>x.key===state.v) : (t.from.find(f=>f.hub_id===state.fromId)||t.from[0]); }
  function draw(){
    const a=active(); const f=t.from.find(x=>x.hub_id===state.fromId)||t.from[0];
    const p0=t.passes[0];
    const switches=(t.from.length>1||t.variants.length)?`<div class="sw">${t.from.map(x=>`<button data-f="${esc(x.hub_id)}" class="${!state.v&&state.fromId===x.hub_id?'on':''}">${esc(fromLine(x)||x.hub||'출발')}</button>`).join('')}${t.variants.map(v=>`<button data-v="${esc(v.key)}" class="${state.v===v.key?'on':''}">${esc(v.label)}</button>`).join('')}</div>`:'';
    let s=`
    <div class="top"><a class="pill" href="#/">← 여행</a><div class="ttl">${esc(t.title_ko)}</div><button class="pill ${saved.has(t.trip_id)?'on':''}" id="saveBtn">${saved.has(t.trip_id)?'보관함에 있어요':'보관'}</button></div>
    <div class="hero" style="${photoStyle(t.photo)}"><div class="tx"><div class="s">${esc(a.scene||t.scene)}</div></div></div>
    <div class="sec"><h3>한눈에</h3>${switches}<div class="glance">
      <div><b>며칠</b>${esc(t.days_label)}</div><div><b>얼마</b>${esc(a.l2||t.l2)}</div>
      <div><b>가는 길</b>${esc(fromLine(f))}<br><span class="m">${esc(a.l3||t.l3)}</span></div>
      <div><b>확인</b><span class="m">${esc(checkedLine(t))}</span></div></div></div>
    <div class="sec"><h3>거기서 뭐 해요</h3><p>${esc(a.what||t.what)}</p>${t.days?t.days.map(d=>`<div class="day"><h4>${esc(d.label)}</h4><ul>${d.steps.map(st=>`<li>${esc(st.what)}${st.how?` <span class="m">· ${esc(st.how)}</span>`:''}${st.note?`<span class="m">${esc(st.note)}</span>`:''}</li>`).join('')}</ul></div>`).join(''):''}</div>
    <div class="sec"><h3>어떻게 다녀요</h3>${t.passes.map((p,i)=>`<div class="pass"><div class="n">${i?'함께 쓰는 패스 · ':''}${esc(p.label)}</div>${i?'':`<div class="big">${esc(a.save||p.save)}</div><p>${esc(a.why||p.why)}</p><p><b>하나만 조심</b> · ${esc(a.care||p.care)}</p>`}</div>`).join('')}</div>
    <div class="sec"><h3>솔직히</h3>${t.honest?`<p>${esc(t.honest)}</p>`:`<p class="m">이 여행이 안 맞는 경우는 아직 정리 중이에요. "왜 이 패스냐면" 안의 단점 문장이 지금은 그 자리예요.</p>`}</div>
    <div class="sec"><div class="btns"><button class="pri" id="shareBtn">같이 갈 사람에게 보내기</button><button id="saveBtn2">${saved.has(t.trip_id)?'보관함에서 빼기':'보관'}</button></div></div>
    <div class="sec"><h3>갈 때 펴 보기</h3>${howtoLines(t,a,h,state)}</div>
    ${region?`<div class="sec"><h3>이 지역 더</h3><div class="list"><a href="#/r/${esc(t.region_id)}"><div class="ph" style="${photoStyle(t.photo)}"></div><div><b>${esc(region.display.ko)}</b><small>${esc(region.admin.ko)} · 여행 ${TRIPS.filter(x=>x.region_id===t.region_id&&x.kind==='trip').length} · 하루 코스 ${TRIPS.filter(x=>x.region_id===t.region_id&&x.kind==='day').length}</small></div></a></div></div>`:''}
    <div class="foot">${esc(checkedLine(t))} <a href="${FORM}" target="_blank" rel="noopener">틀린 곳 알려주기</a><br>${credit(t.photo)}</div>`;
    app.innerHTML=s;
    app.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{ if(b.dataset.v!==undefined){ state.v=b.dataset.v; } else { state.v=null; state.fromId=b.dataset.f; } draw(); });
    const toggle=()=>{ if(saved.has(t.trip_id)){ saved.delete(t.trip_id); toast('보관함에서 뺐어요'); } else { saved.add(t.trip_id); toast('보관했어요'); ev('save',t.trip_id); } saveSaved(); draw(); };
    document.getElementById('saveBtn').onclick=toggle; document.getElementById('saveBtn2').onclick=toggle;
    document.getElementById('shareBtn').onclick=()=>share(t,a);
    const pf=document.getElementById('pf'); if(pf){ pf.querySelectorAll('input,select').forEach(el=>el.onchange=()=>{ state.date=pf.querySelector('[name=d]').value; state.adults=+pf.querySelector('[name=a]').value; state.children=+pf.querySelector('[name=c]').value; draw(); }); }
  }
  draw(); window.scrollTo(0,0); track('/t/'+t.trip_id);
}
function jaDate(iso){ if(!iso) return '〇月〇日'; const [y,m,d]=iso.split('-').map(Number); return m+'月'+d+'日'; }
function addDays(iso,n){ const [y,m,d]=iso.split('-').map(Number); const t=new Date(y,m-1,d+n); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
/* §7 — howto 19칸을 여행자 행동 6줄로 접는다. 데이터는 안 건드리고 표시만 */
function howtoLines(t,a,h,state){
  const v=(sec,k)=>{ const c=h&&h[sec]&&h[sec][k]; return c&&c.v?c.v:null; };
  const join=arr=>arr.filter(Boolean).map(x=>Array.isArray(x)?x.map(w=>w.name+(w.online?'(온라인)':'')).join(' · '):x).join(' ');
  let phrase=a.phrase||'';
  if(t.plan&&t.plan.phrase_template&&!state.v){
    const ret=state.date?addDays(state.date,t.plan.nights):'';
    phrase=t.plan.phrase_template.replace('{adults}',state.adults).replace('{children_part}',state.children?('、小児'+state.children+'枚'):'').replace('{date_ja}',jaDate(state.date)).replace('{return_ja}',jaDate(ret));
  }
  const lines=[];
  if(h){
    const l1=join([v('before','who_can_buy'),v('before','bring'),v('before','app_or_account'),v('before','when')]); if(l1) lines.push(['사기 전에',md(l1),'']);
    const where=v('buy','where'); let l2=''; if(Array.isArray(where)){ const on=where.filter(w=>w.online), off=where.filter(w=>!w.online); l2=off.slice(0,2).map(w=>w.name).join(' · ')+(on.length?' · 온라인도 돼요('+on.map(w=>w.name).join('·')+')':''); } else if(where) l2=where;
    if(l2||a.buy) lines.push(['어디서',md(l2||a.buy),md(v('buy','where_note')||(l2&&a.buy&&a.buy!==l2?a.buy:''))]);
  } else if(a.buy) lines.push(['어디서',md(a.buy),'']);
  const howv=plain(v('buy','how')||'');
  if(phrase&&phrase.indexOf('필요 없')<0) lines.push(['창구에서 이렇게',`<span class="ja">${esc(phrase)}</span>`,howv&&howv.indexOf(a.phrase||'§')<0?md(howv):'']);
  else if(howv) lines.push(['창구에서',md(howv),'']);
  if(h){
    const l4=join([v('buy','get_what'),v('buy','pay'),v('issue','exchange'),v('issue','activate'),v('issue','seat')]); if(l4) lines.push(['받으면',md(l4),'']);
    const l5=join([v('use','show'),v('use','count_rules')]); const trap=v('use','trap'); if(l5||trap) lines.push(['쓸 때',md(l5)+(trap?` <b>함정</b> — ${md(trap)}`:''),md(v('use','when_lane_closed')||'')]);
    const l6=join([v('end','return'),v('end','refund'),v('end','overuse')]); if(l6) lines.push(['돌아올 때',md(l6),'']);
  }
  const pf=(t.plan&&t.plan.phrase_template&&!state.v)?`<div class="pf" id="pf"><label>출발일<input type="date" name="d" value="${esc(state.date)}"></label><label>어른<select name="a">${[1,2,3,4].map(n=>`<option ${state.adults===n?'selected':''}>${n}</option>`).join('')}</select></label><label>초등학생<select name="c">${[0,1,2,3].map(n=>`<option ${state.children===n?'selected':''}>${n}</option>`).join('')}</select></label></div>`:'';
  let s=`<details open><summary>사는 곳부터 돌아올 때까지 · ${lines.length}줄</summary>${pf}${lines.map((l,i)=>`<div class="step"><i>${i+1}</i><div><b class="t">${esc(l[0])}</b>${l[1]}${l[2]?`<small>${l[2]}</small>`:''}</div></div>`).join('')}${lines.length?'':'<p class="m">이 패스의 절차는 아직 확인 중이에요.</p>'}</details>`;
  /* 근거: 19칸 원문 + 못 채운 것 + 출처 */
  const SECS=[['before',[['who_can_buy','살 수 있는 사람'],['bring','가져갈 것'],['when','언제 사나'],['app_or_account','앱·계정']]],['buy',[['where','어디서 사나'],['where_note','파는 자리 주의'],['how','창구에서'],['pay','결제'],['get_what','손에 쥐는 것']]],['issue',[['exchange','교환'],['activate','이용 개시'],['seat','좌석']]],['use',[['show','어떻게 보여 주나'],['count_rules','쓰는 규칙'],['when_lane_closed','안 될 때'],['trap','가장 자주 걸리는 것']]],['end',[['return','반납'],['refund','환불'],['overuse','초과·구역 밖']]]];
  let g='';
  if(h){ for(const [sec,keys] of SECS) for(const [k,label] of keys){ const c=h[sec]&&h[sec][k]; if(!c||!c.v) continue; const val=Array.isArray(c.v)?c.v.map(w=>w.name+(w.local?' / '+w.local:'')+(w.note?' · '+w.note:'')).join(' · '):c.v; g+=`<div class="cell"><b>${esc(label)}</b>${md(val)}${c.q?`<span class="q">${esc(c.q)}</span>`:''}${c.src&&/^https?:/.test(c.src)?`<a href="${esc(c.src)}" target="_blank" rel="noopener">${esc(c.src)}</a>`:''}</div>`; }
    if(h.gaps&&h.gaps.length) g+=h.gaps.filter(x=>!/0-B|추출|extract/.test(x.what+x.how)).map(x=>`<div class="gap"><b>아직 확인 못 한 것 · ${esc(x.what)}</b><span>${md(x.how)}</span></div>`).join('');
    if(h.sources&&h.sources.length) g+=`<p class="m">출처 · ${h.sources.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener" style="color:var(--accent)">${esc(x.url)}</a>${x.checked?' ('+esc(x.checked)+' 확인)':''}`).join('<br>')}</p>`; }
  if(a.basis) g+=`<div class="cell"><b>숫자의 근거</b>${esc(a.basis)}</div>`;
  if(t.plan&&t.plan.cautions) g+=`<div class="cell"><b>조심할 것 전부</b>${t.plan.cautions.map(esc).join(' · ')}</div>`;
  s+=`<details><summary>근거 보기 · 원문 인용 · 아직 확인 못 한 것</summary>${g||'<p class="m">아직 없어요.</p>'}</details>`;
  return s;
}
function share(t,a){
  ev('share',t.trip_id);
  const url=location.href.split('#')[0]+'#/t/'+t.trip_id; const text=(a.scene||t.scene)+' · '+(a.l2||t.l2);
  if(navigator.share){ navigator.share({title:t.title_ko+' · 로카패스',text,url}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text+'\n'+url).then(()=>toast('링크를 복사했어요')).catch(()=>toast(url)); }
  else toast(url);
}
/* ── 3. 지역 페이지 ─────────────────────────────────── */
function mini(t,hid){ const f=pickFrom(t,hid); return `<a href="${tripUrl(t,hid)}"><div class="ph" style="${photoStyle(t.photo)}"></div><div><b>${esc(t.title_ko)}</b><small>${esc(assure(t,f))}</small></div></a>`; }
function renderRegion(rid){
  const r=REGIONS[rid]; if(!r){ location.hash='#/'; return; }
  const trips=TRIPS.filter(t=>t.region_id===rid&&t.kind==='trip'), days=TRIPS.filter(t=>t.region_id===rid&&t.kind==='day');
  const photo=(trips[0]||days[0]||{}).photo;
  const ps=PASSES.filter(p=>p.region_id===rid&&p.trust_level!=='retired');
  const period=(trips[0]&&PASSES.find(p=>p.pass_id===trips[0].passes[0].pass_id)||{}).use_period;
  const pprice=p=>{ const a=(p.price||[]).find(x=>x.category==='adult'); return a?(a.currency==='JPY'?a.amount.toLocaleString()+'엔':'NT$'+a.amount.toLocaleString()):''; };
  app.innerHTML=`
  <div class="top"><a class="pill" href="#/">← 여행</a><div class="ttl">${esc(r.display.ko)}</div><a class="pill" href="#/saved">보관 ${saved.size}</a></div>
  <div class="hero" style="height:34vh;max-height:260px;${photoStyle(photo)}"><div class="tx"><div class="s">${esc(r.display.ko)} · ${esc(r.display.local)}</div></div></div>
  <div class="sec"><p>${esc(r.admin.ko)}${r.block?` · ${esc(r.block)}`:''}${r.base_city?` · 거점은 ${esc(r.base_city.ko)}(${esc(r.base_city.local)})`:''}. 한국 직항 ${r.direct_flight_kr&&r.direct_flight_kr.value?'있음':'없음'}.</p></div>
  <div class="sec"><h3>이 지역 여행</h3><div class="list">${trips.map(t=>mini(t,hub)).join('')||'<p class="m">아직 없어요.</p>'}</div></div>
  <div class="sec"><h3>하루 코스</h3><div class="list">${days.map(t=>mini(t,hub)).join('')||'<p class="m">없음.</p>'}</div></div>
  <div class="sec"><h3>가는 법</h3><div class="glance">${(r.nearby_hubs||[]).map(n=>`<div><b>${esc(HUBS[n.hub_id]?HUBS[n.hub_id].name.ko:n.hub_id)}</b>${esc(hoursKo(n.hours))}${n.how?` · ${esc(n.how)}`:''}</div>`).join('')}${period?`<div><b>언제</b>패스 이용 ${esc(period.from)} ~ ${esc(period.to)}</div>`:''}</div></div>
  <div class="sec"><details><summary>이 지역 패스 전부 (${ps.length})</summary>${ps.map(p=>`<div class="cell"><b>${esc((p.name&&p.name.ko)||'')}</b>${esc((p.name&&p.name.local)||p.pass_id)}${pprice(p)?' · '+pprice(p):''}${p.card_status==='has_card'?'':' <span class="m">· 여행으로는 안 만들었어요</span>'}</div>`).join('')||'<p class="m">없음.</p>'}</details></div>
  <div class="foot">${credit(photo)}</div>`;
  window.scrollTo(0,0); track('/r/'+rid);
}
/* ── 4. 출발 도시에서 ───────────────────────────────── */
function renderFrom(hid){
  const h=HUBS[hid]; if(!h){ location.hash='#/'; return; }
  const list=TRIPS.filter(t=>t.kind==='trip'&&t.from.some(f=>f.hub_id===hid)).sort((a,b)=>(pickFrom(a,hid).hours??99)-(pickFrom(b,hid).hours??99));
  const near=list.find(t=>pickFrom(t,hid).hours!=null&&pickFrom(t,hid).hours<=3&&t.nights===2);
  app.innerHTML=`
  <div class="top"><a class="pill" href="#/">← 여행</a><div class="ttl">${esc(h.name.ko)}에서</div><a class="pill" href="#/saved">보관 ${saved.size}</a></div>
  ${near?`<div class="sec"><h3>${esc(h.name.ko)} 4일 대신</h3><p>${esc(h.name.ko)} 2일 + ${esc(near.region_ko)} 2일. ${esc(fromLine(pickFrom(near,hid)))}.</p></div>`:''}
  <div class="sec"><h3>가까운 순서</h3><div class="list">${list.map(t=>mini(t,hid)).join('')||'<p class="m">이 도시에서 출발하는 여행이 아직 없어요.</p>'}</div></div>
  <div class="foot">시간은 특급·버스 기준의 대략이에요. 공항은 ${esc(h.airport||'')}.</div>`;
  window.scrollTo(0,0); track('/from/'+hid);
}
/* ── 5. 보관함 ─────────────────────────────────────── */
function renderSaved(q){
  if(q.ids){ const ids=q.ids.split(',').filter(x=>TRIPS.some(t=>t.trip_id===x)); if(ids.length&&ids.join(',')!==[...saved].join(',')&&!LS('lp3_recv_'+q.ids)){ ids.forEach(x=>saved.add(x)); saveSaved(); LSs('lp3_recv_'+q.ids,'1'); ev('received'); toast('받은 여행을 보관함에 넣었어요'); } }
  const list=[...saved].map(id=>TRIPS.find(t=>t.trip_id===id)).filter(Boolean);
  app.innerHTML=`
  <div class="top"><a class="pill" href="#/">← 여행</a><div class="ttl">보관함</div><span></span></div>
  <div class="sec"><div class="list">${list.map(t=>mini(t,hub)).join('')||'<p class="empty">아직 보관한 여행이 없어요.<br>여행 페이지의 "보관"을 누르면 여기 모여요.</p>'}</div>
  ${list.length?`<div class="btns"><button class="pri" id="sendAll">같이 볼 사람에게 보내기</button></div>`:''}
  <p class="m" style="margin-top:10px">주소와 이 브라우저에만 저장돼요. 주소를 잃으면 목록도 사라져요.</p></div>`;
  const b=document.getElementById('sendAll'); if(b) b.onclick=()=>{ ev('sendall'); const url=location.href.split('#')[0]+'#/saved?ids='+[...saved].join(','); if(navigator.share){ navigator.share({title:'보관한 여행 '+saved.size+'개 · 로카패스',url}).catch(()=>{}); } else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>toast('링크를 복사했어요')).catch(()=>toast(url)); } else toast(url); };
  window.scrollTo(0,0); track('/saved');
}
/* ── 라우터 (옛 주소 #c= #detail= #p= #plan= 도 받는다) ── */
function parse(){
  let h=location.hash||'#/';
  const legacy=h.match(/^#(?:c|detail|plan)=(\d+)/); if(legacy){ const t=TRIPS.find(x=>x.source_cards.includes(+legacy[1])); return t?{p:'t',id:t.trip_id,q:{}}:{p:'feed',q:{}}; }
  const lp=h.match(/^#p=([\d,]+)/); if(lp){ const ids=lp[1].split(',').map(Number).map(n=>(TRIPS.find(x=>x.source_cards.includes(n))||{}).trip_id).filter(Boolean); return {p:'saved',q:{ids:ids.join(',')}}; }
  const [path,qs]=h.slice(1).split('?'); const q={}; (qs||'').split('&').forEach(kv=>{ const [k,v]=kv.split('='); if(k) q[k]=decodeURIComponent(v||''); });
  const seg=path.split('/').filter(Boolean);
  if(!seg.length) return {p:'feed',q};
  if(seg[0]==='t') return {p:'t',id:seg[1],q}; if(seg[0]==='r') return {p:'r',id:seg[1],q};
  if(seg[0]==='from') return {p:'from',id:seg[1],q}; if(seg[0]==='saved') return {p:'saved',q};
  return {p:'feed',q};
}
function route(){ const r=parse(); if(r.p==='t') renderTrip(r.id,r.q); else if(r.p==='r') renderRegion(r.id); else if(r.p==='from') renderFrom(r.id); else if(r.p==='saved') renderSaved(r.q); else renderFeed(); }
window.addEventListener('hashchange',route);
load().then(route).catch(e=>{ app.innerHTML='<p class="empty">데이터를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.</p>'; console.error(e); });
</script>
