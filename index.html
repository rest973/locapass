<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로카패스 덱 프로토타입</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F5F6F2; --card:#FFFFFF; --ink:#1B2530; --ink2:#4A555D; --mute:#7A8580; --line:#DDE2DC;
  --accent:#0E6F6A; --accent-soft:#DDEBE8; --warn:#9C3F2B; --photo1:#3E7C8C; --photo2:#8CB3A8;
  --ok:#2E7D4F; --ok-soft:#DFEEE3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A1B; --card:#1C2527; --ink:#E6EAE6; --ink2:#C0C9C4; --mute:#8D9994; --line:#2C3739;
    --accent:#56B8B1; --accent-soft:#17302F; --warn:#E0806A; --photo1:#274F5A; --photo2:#3C6B62;
    --ok:#6CC08F; --ok-soft:#173023;
  }
}
:root[data-theme="dark"]{
  --bg:#131A1B; --card:#1C2527; --ink:#E6EAE6; --ink2:#C0C9C4; --mute:#8D9994; --line:#2C3739;
  --accent:#56B8B1; --accent-soft:#17302F; --warn:#E0806A; --photo1:#274F5A; --photo2:#3C6B62;
  --ok:#6CC08F; --ok-soft:#173023;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.app{max-width:1100px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.wordmark{font-weight:700;letter-spacing:-.01em;font-size:18px}
.wordmark small{font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11px;color:var(--mute);margin-left:8px;letter-spacing:.08em}
.hub{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2)}
.hub b{color:var(--accent);font-weight:600}
.mapbtn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.hint{font-size:12.5px;color:var(--mute);margin:0 0 10px}
.deck{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 6px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.slot{flex:0 0 85vw;max-width:360px;scroll-snap-align:center}
@media(min-width:900px){.deck{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;gap:20px}.slot{flex:none;max-width:none}}
.card{position:relative;width:100%;aspect-ratio:1/1.45;perspective:1400px}
.face{position:absolute;inset:0;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.08);backface-visibility:hidden;transition:transform .55s cubic-bezier(.2,.7,.2,1);overflow:hidden;display:flex;flex-direction:column}
@media(prefers-reduced-motion:reduce){.face{transition:none}}
.front{transform:rotateY(0)}
.back{transform:rotateY(180deg)}
.card.flipped .front{transform:rotateY(-180deg)}
.card.flipped .back{transform:rotateY(0)}
.photo{position:relative;flex:0 0 62%;background:linear-gradient(160deg,var(--photo1),var(--photo2));color:#fff}
.photo .ph{position:absolute;top:8px;left:10px;right:30px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.03em;opacity:.9;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo .badge{position:absolute;top:10px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.photo .scene{position:absolute;left:0;right:0;bottom:0;padding:38px 14px 12px;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.65) 45%)}
.photo .scene span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-height:calc(1.35em * 2);font-weight:700;font-size:17px;line-height:1.35}
.meta{padding:12px 14px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.meta .l2{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .l3{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .pass{margin-top:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--mute)}
.tap{position:absolute;right:12px;bottom:10px;font-size:11px;color:var(--mute)}
.back .body{overflow-y:auto;padding:14px 14px 8px;flex:1;font-size:13.5px}
.back h4{margin:10px 0 4px;font-size:12px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;font-family:"IBM Plex Mono",monospace}
.back h4:first-child{margin-top:0}
.back p{margin:0 0 6px}
.back .num{font-size:15px;font-weight:700}
.back details{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:8px 0;font-size:12.5px;color:var(--ink2)}
.back summary{cursor:pointer;font-weight:600;color:var(--ink)}
.back code{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--accent-soft);padding:1px 5px;border-radius:3px;display:inline-block;margin:3px 0}
.back .foot{display:flex;gap:8px;padding:8px 12px 12px;border-top:1px solid var(--line);background:var(--card)}
.back .foot button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 6px;font-size:12.5px}
.back .foot button.primary{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.back .trust{font-size:11px;color:var(--mute);padding:0 14px 6px}
.actions{display:flex;gap:10px;justify-content:center;margin-top:8px}
.actions button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 20px;font-size:14px}
.actions button.pin{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
@media(min-width:900px){.actions{display:none}}
.pinned .photo .badge{background:var(--accent);box-shadow:0 0 0 3px #fff}
.pinmark{position:absolute;left:12px;bottom:calc(42% + 8px);font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px;display:none}
.pinned .pinmark{display:inline-block}
.measure{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 16px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink2);display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.measure b{color:var(--ink)}
.measure span.l{color:var(--mute)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet[hidden]{display:none}
.sheet .box{background:var(--card);color:var(--ink);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:20px 18px 26px}
@media(min-width:640px){.sheet{align-items:center}.sheet .box{border-radius:16px}}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet p{margin:0 0 14px;color:var(--mute);font-size:13px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px}
.opts button.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.mapview{margin-top:4px}
.mapview[hidden]{display:none}
.mapview h3{margin:0 0 4px;font-size:18px}
.mapview .sub{color:var(--mute);font-size:13px;margin:0 0 12px}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:0 0 16px}
.pin{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);position:relative}
.pin .ph{height:110px;background-size:cover;background-position:center}
.pin .t{padding:8px 10px 10px;font-size:12.5px;line-height:1.4;font-weight:600}
.pin .t small{display:block;font-weight:400;color:var(--mute);margin-top:3px}
.pin button{position:absolute;top:6px;right:6px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;width:24px;height:24px;font-size:14px;line-height:1}
.mapview .empty{color:var(--mute);font-size:14px;border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center}
.maptools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.maptools button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:13.5px}
.maptools button.primary{border-color:var(--accent);background:var(--accent);color:#fff;font-weight:600}
.maptools button:disabled{opacity:.45;cursor:default}
.mapview .url{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--mute);word-break:break-all}
.banner{border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 0 12px}
.banner[hidden]{display:none}
.banner button{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.shareout{margin-top:12px}
.shareout[hidden]{display:none}
.shareout img{width:100%;max-width:300px;border:1px solid var(--line);border-radius:8px;display:block}
.shareout a{display:inline-block;margin-top:8px;font-size:13px;color:var(--accent)}
.back-to-deck{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:56px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

</head>
<body>
<div class="app">
  <header>
    <div class="wordmark">로카패스 <small>DECK PROTOTYPE v1.8 · 21 cards</small></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="hub" id="hubBtn" aria-label="출발 거점 바꾸기">거점 <b id="hubLabel">안 정함</b></button>
      <button class="mapbtn" id="mapBtn">언젠가 지도 <span id="pinCount">0</span></button>
    </div>
  </header>
  <div class="banner" id="recvBanner" hidden><span id="recvText"></span><button id="recvBtn">내 지도로 만들기</button></div>
  <div id="deckView">
  <p class="hint">카드를 누르면 뒤집힙니다. 옆으로 밀면 다음 카드. 사진은 위키미디어 공용 자유 라이선스(v1.5). 카드는 data/cards.json에서 읽습니다.</p>

  <div class="deck" id="deck" aria-label="여행 한 장 덱"></div>

  <div class="actions">
    <button id="skipBtn">넘기기</button>
    <button class="pin" id="pinBtn">지도에 꽂기</button>
  </div>
  </div>

  <section class="mapview" id="mapview" hidden>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h3>언젠가 지도</h3>
      <button class="back-to-deck" id="backBtn">← 카드로</button>
    </div>
    <p class="sub">꽂아 둔 여행. 이 지도는 주소에만 저장돼요. 주소를 잃으면 지도도 사라져요.</p>
    <div class="maptools">
      <button class="primary" id="copyBtn">내 지도 링크 복사</button>
      <button id="imgBtn">공유 이미지 만들기</button>
    </div>
    <div id="mapList"></div>
    <div class="url" id="mapUrl"></div>
    <div class="shareout" id="shareout" hidden></div>
  </section>
</div>

<div class="measure" id="measure" aria-live="polite">
  <div><span class="l">뒤집기</span> <b id="mFlip">0</b></div>
  <div><span class="l">꽂기</span> <b id="mPin">0</b></div>
  <div><span class="l">공유</span> <b id="mShare">0</b></div>
  <div><span class="l">넘기기</span> <b id="mSkip">0</b></div>
  <div><span class="l">링크복사</span> <b id="mCopy">0</b></div>
  <div><span class="l">이미지</span> <b id="mImage">0</b></div>
  <div><span class="l">받은링크</span> <b id="mReceived">0</b></div>
  <div><span class="l">측정은 이 브라우저 안에서만</span></div>
</div>

<div class="sheet" id="hubSheet" hidden>
  <div class="box" role="dialog" aria-labelledby="hubTitle">
    <h3 id="hubTitle">어디로 자주 가세요?</h3>
    <p>답하면 그 거점에서 가까운 카드가 앞으로 옵니다. 답은 이 브라우저에만 남아요.</p>
    <div class="opts" id="hubOpts">
      <button data-h="오사카">오사카</button>
      <button data-h="도쿄">도쿄</button>
      <button data-h="나고야">나고야</button>
      <button data-h="후쿠오카">후쿠오카</button>
      <button data-h="타이베이">타이베이</button>
      <button data-h="">안 정함</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>

let PHOTOS = {}, CARDS = [];
async function loadData(){
  const [cards] = await Promise.all([fetch('data/cards.json').then(r=>r.json())]);
  CARDS = cards.filter(c=>c.status==='published').map(c=>({
    id:c.id, hub:c.hub, region:c.region_ko, photo:(c.photo&&c.photo.search_terms)||'', editor:c.editor_pick, days:c.days, trust:c.trust,
    scene:c.front.scene, l2:c.front.l2, l3:c.front.l3, pass:c.front.pass_label,
    what:c.back.what, why:c.back.why, save:c.back.save, care:c.back.care, buy:c.back.buy, phrase:c.back.phrase, basis:c.back.basis
  }));
  cards.forEach(c=>{ if(c.photo && c.photo.src) PHOTOS[c.id] = {src:c.photo.src, pos:c.photo.pos, credit:c.photo.credit+' · '+c.photo.license}; });
}
const LS = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const LSset = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
let hub = LS('lp_hub'); // null = not asked yet
let pins = new Set();
try { const m = location.hash.match(/p=([\d,]+)/); if (m) m[1].split(',').forEach(x=>pins.add(+x)); } catch(e){}
const metrics = { flip:0, pin:0, share:0, skip:0, copy:0, image:0, received:0 };
try { Object.assign(metrics, JSON.parse(LS('lp_metrics')||'{}')); } catch(e){}
const flipped = new Set();

function order(){
  const arr = CARDS.slice();
  arr.sort((a,b)=> (b.editor?1:0)-(a.editor?1:0));
  if (hub) arr.sort((a,b)=> (b.hub===hub) - (a.hub===hub));
  return arr;
}
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function render(){
  const deck = document.getElementById('deck'); deck.innerHTML='';
  order().forEach(c=>{
    const slot = el(`<div class="slot" data-id="${c.id}"></div>`);
    const card = el(`
      <div class="card ${pins.has(c.id)?'pinned':''}" tabindex="0" role="button" aria-label="카드 ${c.id} 뒤집기">
        <div class="face front">
          <div class="photo" style="${PHOTOS[c.id]?`background-image:url(${PHOTOS[c.id].src});background-size:cover;background-position:${PHOTOS[c.id].pos}`:``}"><span class="ph">${PHOTOS[c.id]?"사진 "+PHOTOS[c.id].credit+" · Wikimedia Commons · 일부 자름":"사진 자리 · "+c.photo}</span><span class="badge" title="원문 확인 2026-09"></span><div class="scene"><span>${c.scene}</span></div></div>
          <span class="pinmark">지도에 꽂음</span>
          <div class="meta"><div class="l2">${c.l2}</div><div class="l3" style="color:var(--accent)">${c.region||""} · ${c.days||""}</div><div class="l3">${c.l3}</div><div class="pass">${c.pass}</div></div>
          <span class="tap">눌러서 뒤집기</span>
        </div>
        <div class="face back">
          <div class="body">
            <h4>거기서 뭐 해요</h4><p>${c.what}</p>
            <h4>왜 이 패스냐면</h4><p>${c.why}</p>
            <h4>얼마 아껴요</h4><p class="num">${c.save}</p>
            <h4>하나만 조심</h4><p>${c.care}</p>
            <details><summary>사는 법 · 창구 문장 · 근거</summary>
              <p>${c.buy}</p><code>${c.phrase}</code><p>근거: ${c.basis}</p>
            </details>
          </div>
          <div class="trust">${c.trust.label} · 가격은 창구에서 최종 확인</div>
          <div class="foot">
            <button class="primary" data-act="pin">${pins.has(c.id)?'지도에서 빼기':'지도에 꽂기'}</button>
            <button data-act="share">공유</button>
            <button data-act="clone" title="0-A에서는 자리만">복제</button>
          </div>
        </div>
      </div>`);
    card.addEventListener('click', e=>{
      const b = e.target.closest('button');
      if (b){ e.stopPropagation(); act(b.dataset.act, c, card); return; }
      if (e.target.closest('details')) return;
      toggleFlip(card, c);
    });
    card.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleFlip(card,c);} });
    slot.appendChild(card); deck.appendChild(slot);
  });
  document.getElementById('hubLabel').textContent = hub || '안 정함';
  document.getElementById('pinCount').textContent = pins.size;
  renderMap(); renderMetrics();
}
function toggleFlip(card, c){
  card.classList.toggle('flipped');
  if (card.classList.contains('flipped') && !flipped.has(c.id)){ flipped.add(c.id); metrics.flip++; saveMetrics(); renderMetrics(); }
}
function act(a, c, card){
  if (a==='pin'){
    if (pins.has(c.id)) { pins.delete(c.id); toast('지도에서 뺐어요'); }
    else { pins.add(c.id); metrics.pin++; toast('언젠가 지도에 꽂았어요'); }
    saveMetrics(); syncHash(); LSset('lp_mypins',[...pins].join(',')); render(); if(!document.getElementById('mapview').hidden) renderMap();
  } else if (a==='share'){
    metrics.share++; saveMetrics(); renderMetrics();
    const text = `${c.scene} · ${c.l2}`;
    const url = location.href.split('#')[0] + '#c=' + c.id;
    if (navigator.share){ navigator.share({title:'여행 한 장', text, url}).catch(()=>{}); }
    else if (navigator.clipboard){ navigator.clipboard.writeText(text+'\n'+url).then(()=>toast('링크를 복사했어요')).catch(()=>toast(url)); }
    else toast(url);
  } else if (a==='clone'){ toast('복제 계획은 0-A 다음에 만들어요'); }
}
function current(){
  const deck=document.getElementById('deck'); const slots=[...deck.children];
  let best=null, bd=1e9; const mid=deck.scrollLeft+deck.clientWidth/2;
  slots.forEach(s=>{ const d=Math.abs(s.offsetLeft+s.offsetWidth/2-mid); if(d<bd){bd=d;best=s;} });
  return best;
}
document.getElementById('skipBtn').addEventListener('click', ()=>{
  const s=current(); if(!s) return; metrics.skip++; saveMetrics(); renderMetrics();
  const deck=document.getElementById('deck'); deck.appendChild(s); deck.scrollTo({left:deck.scrollLeft, behavior:'auto'});
  const next=current(); if(next) next.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
});
document.getElementById('pinBtn').addEventListener('click', ()=>{
  const s=current(); if(!s) return; const id=+s.dataset.id; const c=CARDS.find(x=>x.id===id); act('pin', c, s.firstElementChild);
});
function showMap(on){
  document.getElementById('mapview').hidden=!on; document.getElementById('deckView').hidden=on;
  if(on){ renderMap(); window.scrollTo({top:0}); }
}
document.getElementById('mapBtn').addEventListener('click', ()=>showMap(document.getElementById('mapview').hidden));
document.getElementById('backBtn').addEventListener('click', ()=>showMap(false));
document.getElementById('copyBtn').addEventListener('click', ()=>{
  metrics.copy++; saveMetrics(); renderMetrics();
  const url=location.href;
  if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>toast('내 지도 링크를 복사했어요')).catch(()=>toast(url)); } else toast(url);
});
document.getElementById('imgBtn').addEventListener('click', makeShareImage);
document.getElementById('recvBtn').addEventListener('click', ()=>{
  LSset('lp_mypins', [...pins].join(',')); document.getElementById('recvBanner').hidden=true; toast('내 지도가 됐어요'); showMap(true);
});
document.getElementById('hubBtn').addEventListener('click', ()=>{ document.getElementById('hubSheet').hidden=false; });
document.getElementById('hubOpts').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  hub=b.dataset.h; LSset('lp_hub', hub); document.getElementById('hubSheet').hidden=true; render();
});
function syncHash(){ const p=[...pins].join(','); history.replaceState(null,'', p? '#p='+p : location.pathname); }
function renderMap(){
  const list=document.getElementById('mapList');
  document.getElementById('imgBtn').disabled = !pins.size; document.getElementById('copyBtn').disabled = !pins.size;
  if(!pins.size){ list.innerHTML='<p class="empty">아직 꽂은 카드가 없어요.<br>마음에 드는 카드 뒷면에서 "지도에 꽂기".</p>'; }
  else {
    list.innerHTML='<div class="pins">'+[...pins].map(id=>{const c=CARDS.find(x=>x.id===id); const p=PHOTOS[c.id];
      return `<div class="pin"><div class="ph" style="${p?`background-image:url(${p.src});background-position:${p.pos}`:''}"></div><div class="t">${c.scene.split('.')[0]}<small>${c.l2}</small></div><button data-unpin="${c.id}" aria-label="빼기">×</button></div>`;}).join('')+'</div>';
    list.querySelectorAll('button[data-unpin]').forEach(b=>b.addEventListener('click',()=>{ pins.delete(+b.dataset.unpin); syncHash(); LSset('lp_mypins',[...pins].join(',')); render(); renderMap(); }));
  }
  document.getElementById('mapUrl').textContent = pins.size ? '이 지도의 주소: '+location.href : '';
}
function wrapText(ctx, text, maxW){
  const lines=[]; let line='';
  for(const ch of text){ const t=line+ch; if(ctx.measureText(t).width>maxW && line){ lines.push(line); line=ch; } else line=t; }
  if(line) lines.push(line); return lines;
}
function loadImg(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; }); }
async function makeShareImage(){
  if(!pins.size) return;
  metrics.image++; saveMetrics(); renderMetrics();
  const W=1080,H=1920; const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const ctx=cv.getContext('2d');
  ctx.fillStyle='#F5F6F2'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0E6F6A'; ctx.font='600 34px "IBM Plex Sans KR", sans-serif'; ctx.fillText('로카패스 · 언젠가 지도', 72, 120);
  ctx.fillStyle='#1B2530'; ctx.font='700 64px "IBM Plex Sans KR", sans-serif'; ctx.fillText('꽂아 둔 여행 '+pins.size+'장', 72, 210);
  const ids=[...pins].slice(0,4); const cardH= ids.length<=2? 560: 360; let y=280; const credits=[];
  for(const id of ids){
    const c=CARDS.find(x=>x.id===id); const p=PHOTOS[id];
    const x=72, w=W-144, h=cardH;
    ctx.save(); ctx.beginPath(); ctx.roundRect(x,y,w,h,28); ctx.clip();
    ctx.fillStyle='#3E7C8C'; ctx.fillRect(x,y,w,h);
    if(p){ const im=await loadImg(p.src); if(im){ const sc=Math.max(w/im.width,h/im.height); const dw=im.width*sc, dh=im.height*sc; ctx.drawImage(im, x+(w-dw)/2, y+(h-dh)*0.45, dw, dh); } credits.push(p.credit); }
    const g=ctx.createLinearGradient(0,y+h*0.35,0,y+h); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.72)'); ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
    ctx.fillStyle='#fff'; ctx.font='700 40px "IBM Plex Sans KR", sans-serif';
    const lines=wrapText(ctx, c.scene, w-72).slice(0,2); let ty=y+h-40-(lines.length-1)*50;
    for(const l of lines){ ctx.fillText(l, x+36, ty); ty+=50; }
    ctx.font='500 28px "IBM Plex Sans KR", sans-serif'; ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fillText(c.l2, x+36, y+h-40-lines.length*50);
    ctx.restore(); y+=h+28;
  }
  if(pins.size>4){ ctx.fillStyle='#4A555D'; ctx.font='500 30px "IBM Plex Sans KR", sans-serif'; ctx.fillText('외 '+(pins.size-4)+'장', 72, y+20); }
  ctx.fillStyle='#1B2530'; ctx.font='600 30px "IBM Plex Mono", monospace'; ctx.fillText(location.host+location.pathname, 72, H-150);
  ctx.fillStyle='#4A555D'; ctx.font='500 26px "IBM Plex Sans KR", sans-serif'; ctx.fillText('너도 꽂아 봐. 계정 없이, 주소 하나로.', 72, H-105);
  ctx.fillStyle='#7A8580'; ctx.font='400 20px "IBM Plex Mono", monospace';
  const cr='사진 '+[...new Set(credits)].join(' · ')+' · Wikimedia Commons · 일부 자름'; wrapText(ctx, cr, W-144).slice(0,2).forEach((l,i)=>ctx.fillText(l, 72, H-58+i*26));
  const out=document.getElementById('shareout'); out.hidden=false;
  cv.toBlob(async blob=>{
    const url=URL.createObjectURL(blob); const file=new File([blob],'locapass-map.png',{type:'image/png'});
    out.innerHTML='<img src="'+url+'" alt="공유 이미지"><a href="'+url+'" download="locapass-map.png">이미지 저장</a>';
    if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], text:'내 언젠가 지도 · '+location.href}); metrics.share++; saveMetrics(); renderMetrics(); }catch(e){} }
  },'image/png');
}
function renderMetrics(){ for(const k of ['flip','pin','share','skip','copy','image','received']) document.getElementById('m'+k[0].toUpperCase()+k.slice(1)).textContent=metrics[k]; }
function saveMetrics(){ LSset('lp_metrics', JSON.stringify(metrics)); }
let toastT; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1600); }

loadData().then(()=>{
render();
(function(){
  const mine=LS('lp_mypins'); const cur=[...pins].join(',');
  if(pins.size && mine!==cur && !LS('lp_recv_'+cur)){
    metrics.received++; saveMetrics(); renderMetrics(); LSset('lp_recv_'+cur,'1');
    document.getElementById('recvText').textContent=pins.size+'장이 꽂힌 지도를 받았어요.';
    document.getElementById('recvBanner').hidden=false;
  }
})();
if (hub===null) document.getElementById('hubSheet').hidden=false;
}).catch(e=>{ document.getElementById('deck').innerHTML='<p class="hint">데이터를 불러오지 못했어요. 주소로 직접 열어 주세요.</p>'; console.error(e); });
</script>
